[project]
name = "secondear"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "torch",
    "torchaudio",
    "pyroomacoustics",
    "spaudiopy",
    "sofar",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "requests",
    "tensorboard>=2.21.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondear"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
