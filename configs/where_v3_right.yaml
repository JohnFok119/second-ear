# Where-only (class-agnostic) heat-map localizer, v3 scenes (48 kHz), ears=right, no augmentation (phase 7 C9: right-ear twin of where_v3). Loaded by scripts/train_heatmap.py,
# eval_heatmap.py and pick_threshold.py; command-line flags override these values.
# Hyperparameters equal configs/heatmap_binaural.yaml; only agnostic, data, ears and experiment differ.
coarse_step_deg: 10   # network output grid (19 x 36)
fine_step_deg: 5      # upsampled grid used for targets, loss and decoding (37 x 72)
fwhm_deg: 15.0        # target blob full width at half maximum
gamma: 2.0            # focal exponent
lr: 0.001
epochs: 60
patience: 60          # no early stop: epoch 0 one-ear SELD is a fluke (over-guessing inflates LR), so train all 60 epochs like v2 where_right (best 58)
batch_size: 32
threshold: 0.20       # one-ear maps rarely reach 0.5, so epoch selection uses the C3 val-picked value; the runner still overrides it for test
seed: 42
amp: true             # mixed precision, cuda only
tail: pad
agnostic: true        # one target map (union of all events, any class), one output map, class 0
data: binaural_v3     # scene cache data/features/binaural_v3: train / val (selection) / test
ears: right
experiment: where_v3_right
