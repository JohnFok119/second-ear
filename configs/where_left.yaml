# Where-only (class-agnostic) heat-map localizer, v2 scenes, ears=left (PLAN C5.2). Loaded by scripts/train_heatmap.py,
# eval_heatmap.py and pick_threshold.py; command-line flags override these values.
# Hyperparameters equal configs/heatmap_binaural.yaml; only agnostic, data, ears and experiment differ.
coarse_step_deg: 10   # network output grid (19 x 36)
fine_step_deg: 5      # upsampled grid used for targets, loss and decoding (37 x 72)
fwhm_deg: 15.0        # target blob full width at half maximum
gamma: 2.0            # focal exponent
lr: 0.001
epochs: 100
batch_size: 32
threshold: 0.5        # decoding threshold on sigmoid maps (the runner overrides it with the val-picked one)
seed: 42
amp: true             # mixed precision, cuda only
tail: pad
agnostic: true        # one target map (union of all events, any class), one output map, class 0
data: binaural_v2     # scene cache data/features/binaural_v2: train / val (selection) / test
ears: left
experiment: where_left
