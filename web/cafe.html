<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel café</title>
<link rel="stylesheet" href="style.css">
<style>
  main.cafe-main { max-width:1100px; margin:0 auto; padding:0 12px 24px; min-width:0; }
  #cafe { position:relative; width:100%; aspect-ratio:16/10; max-height:calc(100vh - 220px); background:#14100d; overflow:hidden; }
  #cafe canvas { display:block; width:100%; height:100%; image-rendering:pixelated; touch-action:none; cursor:grab; }
  #cafe-hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); padding:8px 16px; border-radius:20px;
    background:rgba(20,16,13,.78); color:#fff; font-size:1rem; pointer-events:none; transition:opacity .6s; white-space:nowrap; }
  #cafe-hint.gone { opacity:0; }
  .cafe-main .sc-controls { min-width:0; }
  .cafe-main .sc-controls input[type=range] { flex:1 1 200px; min-width:120px; min-height:44px; accent-color:var(--accent); }
  #cafe-time-out { min-width:7.5em; text-align:right; font-variant-numeric:tabular-nums; }
  #cafe-caption { min-height:1.6em; margin:8px 0 2px; font-weight:600; font-size:1.05rem; }
  #cafe-ear-status { margin:6px 0; }
  #cafe-legend[hidden] { display:none; }
  #cafe-legend p { margin:6px 0; }
  #cafe-live { font-weight:600; }
  .cafe-key { list-style:none; margin:8px 0 4px; padding:0; display:flex; flex-wrap:wrap; gap:6px 18px; }
  .cafe-key li { display:flex; align-items:center; gap:6px; }
  .sw { display:inline-block; width:16px; height:16px; border-radius:50%; flex:none; }
  .sw.two { background:#19e6ff; } .sw.one { background:#ff3fb4; }
  .sw.truth { border:3px solid #ffe27a; box-sizing:border-box; } .sw.fill { background:#fff; }
  @media (max-width: 600px) {
    #cafe { aspect-ratio:4/5; max-height:none; }
    .cafe-main .bigbtn, .cafe-main .seg button { min-height:44px; }
    .cafe-key { flex-direction:column; }
    .cafe-main .small, .cafe-main .cafe-key li, .cafe-main p, .cafe-main output, .cafe-main .sc-lbl { font-size:14px; }
    .cafe-main .sc-controls { gap:8px 10px; }
    #cafe-time-out { min-width:0; text-align:left; }
    .cafe-main .seg button { padding:8px 14px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<main class="cafe-main">
<div id="cafe" role="img" aria-label="A warm pixel-art café seen from Johnny's seat">
  <div id="cafe-hint">Drag to look around</div>
</div>
<p id="cafe-caption" aria-live="polite">Quiet café</p>
<div class="sc-controls">
  <button id="cafe-play" class="bigbtn" type="button">&#9654; Play</button>
  <input id="cafe-time" type="range" min="0" max="30" step="0.05" value="0" aria-label="Time in the clip">
  <output id="cafe-time-out" for="cafe-time">0.0 / 30.0 s</output>
</div>
<div class="sc-controls">
  <span class="sc-lbl" id="cafe-mode-lbl">View:</span>
  <div class="seg" role="group" aria-labelledby="cafe-mode-lbl">
    <button type="button" id="cafe-mode-seat" aria-pressed="true">Sit in my seat</button>
    <button type="button" id="cafe-mode-over" aria-pressed="false">See from above</button>
  </div>
</div>
<div id="cafe-legend" hidden>
  <ul class="cafe-key">
    <li><i class="sw two"></i> Teal: two ears</li>
    <li><i class="sw one"></i> Pink: one ear (right)</li>
    <li><i class="sw truth"></i> Yellow ring: where the sound really was</li>
    <li><i class="sw fill"></i> Filled: within 20° of a real sound. Hollow with an x: a miss</li>
  </ul>
  <p id="cafe-live" aria-live="polite"></p>
  <p id="cafe-clipline"></p>
</div>
<div class="sc-controls">
  <span class="sc-lbl" id="cafe-listen-lbl">Listen as:</span>
  <div class="seg" role="group" aria-labelledby="cafe-listen-lbl">
    <button type="button" id="cafe-ear-two" aria-pressed="true">Two ears</button>
    <button type="button" id="cafe-ear-mine" aria-pressed="false">My ear</button>
  </div>
</div>
<p id="cafe-ear-status" aria-live="polite">Two ears: both sides play normally.</p>
<p class="small">Use headphones.</p>
</main>
<script type="module">
  import { mountCafe } from './cafe/cafe.js';
  mountCafe(document.getElementById('cafe'));
</script>
</body>
</html>
