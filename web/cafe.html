<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel café</title>
<link rel="stylesheet" href="style.css">
<style>
  #cafe { position:relative; width:100%; aspect-ratio:16/10; max-height:calc(100vh - 64px); background:#14100d; overflow:hidden; }
  #cafe canvas { display:block; width:100%; height:100%; image-rendering:pixelated; touch-action:none; }
  .cafe-bar { display:flex; align-items:center; gap:12px; padding:10px 16px; }
  .cafe-bar input[type=range] { flex:1; min-height:32px; }
  .cafe-bar output { min-width:4.5em; text-align:right; font-variant-numeric:tabular-nums; }
  @media (max-width: 599px) { #cafe { aspect-ratio:4/5; max-height:none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="cafe" role="img" aria-label="A warm pixel-art café seen from Johnny's seat"></div>
<div class="cafe-bar">
  <label for="cafe-time">Time</label>
  <input id="cafe-time" type="range" min="0" max="30" step="0.05" value="0">
  <output id="cafe-time-out" for="cafe-time">0.0 s</output>
</div>
<script type="module">
  import { mountCafe } from './cafe/cafe.js';
  mountCafe(document.getElementById('cafe'));
</script>
</body>
</html>
